name: Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -mod=readonly -race -count=1 ./...
      - run: go vet -mod=readonly ./...
      - run: go build -mod=readonly ./cmd/todoist
